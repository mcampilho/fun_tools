[package]
name = "rfetch"
description = "System information next to a logo of the OS or shell (neofetch in Rust)"
version.workspace = true
edition.workspace = true
# sysinfo 0.40 needs 1.95 (the rest of the tools build on 1.91, see the root Cargo.toml).
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only the parts of sysinfo we use: no rayon thread pool, no network/components.
[dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
iana-time-zone = "0.1"
sys-locale = "0.3"
# Small blocking HTTP client (no async runtime) with rustls.
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
] }
