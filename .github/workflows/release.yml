# Builds every tool for Windows and Linux when a version tag (v1.2.3) is pushed,
# and publishes them as a GitHub release with SHA-256 sums and build provenance.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true
      publish:
        description: "Publish the packages in the release (off: only build and test)"
        type: boolean
        default: true

# Least privilege: each job asks for what it needs.
permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  # Same compiler as ci.yml.
  RUST_VERSION: 1.100.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    # Signing the provenance needs the OIDC token and the attestations API.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Version in Cargo.toml matches the tag
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml has version $version but the tag is $TAG"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Windows: the C runtime goes inside the .exe (no Visual C++ redistributable needed).
      # Linux: musl makes static binaries that run on any distribution.
      - name: Test
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --release --locked --workspace --target ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      # Runs a few of the tools that were just built, so a package that builds but does not
      # start (a missing library, a bad build flag) is not published.
      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          count=$(find "$bin" -maxdepth 1 -type f -name "r*$ext" ! -name "*.d" | wc -l)
          echo "$count tools built"
          [ "$count" -ge 27 ] || { echo "::error::expected at least 27 tools, found $count"; exit 1; }
          "$bin/rcowsay$ext" "smoke test" | grep -q "smoke test"
          echo "smoke" | "$bin/rboxes$ext" | grep -q "smoke"
          "$bin/rfiglet$ext" ok | grep -q .
          "$bin/rfetch$ext" -o | grep -q .

      - name: Package
        shell: bash
        run: |
          dir="fun_tools-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          bin="target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bin"/r*.exe "$dir"/
            cp README.md README.pt.md LICENSE "$dir"/
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            find "$bin" -maxdepth 1 -type f -executable -name 'r*' -exec cp {} "$dir"/ \;
            cp README.md README.pt.md LICENSE "$dir"/
            tar -czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -l "$dir"

      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # Creates the release and uploads the packages.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256 sums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "fun_tools $TAG" --generate-notes
          fi
