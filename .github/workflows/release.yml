# Builds every tool for Windows and Linux when a version tag (v1.2.3) is pushed,
# and publishes them as a GitHub release with SHA-256 sums and build provenance.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true
      publish:
        description: "Publish the packages in the release (off: only build and test)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Version in Cargo.toml matches the tag
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml has version $version but the tag is $TAG"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Windows: the C runtime goes inside the .exe (no Visual C++ redistributable needed).
      # Linux: musl makes static binaries that run on any distribution.
      - name: Test
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          dir="fun_tools-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          bin="target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bin"/r*.exe "$dir"/
            cp README.md README.pt.md LICENSE "$dir"/
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            find "$bin" -maxdepth 1 -type f -executable -name 'r*' -exec cp {} "$dir"/ \;
            cp README.md README.pt.md LICENSE "$dir"/
            tar -czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -l "$dir"

      - name: Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256 sums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "fun_tools $TAG" --generate-notes
          fi
